name: Build and Publish

on:
  push:
    tags:
      - '**'

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin version
        id: kotlin_version
        shell: bash
        run: |
          VERSION=$(grep '^kotlin =' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_idea_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_idea_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish runtime library to Maven Central
        if: steps.kotlin_version.outputs.is_idea_build == 'false'
        run: ./gradlew :runtime-library:publishAllPublicationsToMavenCentralRepository

      - name: Publish compiler plugin to Maven Central
        run: ./gradlew :kotlin-compiler-plugin:publishAllPublicationsToMavenCentralRepository

      - name: Publish gradle plugin to Maven Central
        if: steps.kotlin_version.outputs.is_idea_build == 'false'
        run: ./gradlew :gradle-plugin:publishAllPublicationsToMavenCentralRepository

      - name: Publish gradle plugin to Gradle Plugin Portal
        if: steps.kotlin_version.outputs.is_idea_build == 'false'
        run: ./gradlew :gradle-plugin:publishPlugins -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}